<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indian Music Soundboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>🎵 Indian Music Soundboard</h1>

    <div class="controls">
        <label>🔊 Volume</label>
        <input type="range" id="volume" min="0" max="1" step="0.01" value="0.5">

        <button id="stopAll">⛔ Stop All</button>
    </div>

    <div class="soundboard">

        <button data-sound="sound1">🎵 Sa</button>
        <button data-sound="sound2">🎵 Re</button>
        <button data-sound="sound3">🎵 Ga</button>
        <button data-sound="sound4">🎵 Ma</button>
        <button data-sound="sound5">🎵 Pa</button>
        <button data-sound="sound6">🎵 Dha</button>
        <button data-sound="sound7">🎵 Ni</button>

        <button data-sound="sound8">🎵 Sa'</button>
        <button data-sound="sound9">🎵 Re'</button>
        <button data-sound="sound10">🎵 Ga'</button>
        <button data-sound="sound11">🎵 Ma'</button>
        <button data-sound="sound12">🎵 Pa'</button>

    </div>

<script src="script.js"></script>

</body>
</html>
